<!DOCTYPE html>
<html lang="zh-CN" data-theme="system">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>英语二 lite</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&family=Noto+Sans+SC:wght@400;600&family=Noto+Serif+SC:wght@500;600&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap" />
  <style>
    :root, [data-theme="day"] {
      --paper:#f3eee4; --ink:#1c1915; --muted:#6e655c; --card:#fffdf8; --line:#e4d8c8;
      --accent:#8c4b28; --mark:#ead7a2; --ok:#245433; --bad:#8a382c; --okbg:#e5f0e4; --badbg:#f6e4df;
    }
    [data-theme="night"] {
      --paper:#141210; --ink:#f3efe6; --muted:#a3988c; --card:#1e1b17; --line:#312c26;
      --accent:#e4b58a; --mark:#6a5428; --ok:#b7c7a1; --bad:#e0aaa0; --okbg:#243026; --badbg:#322420;
    }
    @media (prefers-color-scheme: dark) {
      [data-theme="system"] {
        --paper:#141210; --ink:#f3efe6; --muted:#a3988c; --card:#1e1b17; --line:#312c26;
        --accent:#e4b58a; --mark:#6a5428; --ok:#b7c7a1; --bad:#e0aaa0; --okbg:#243026; --badbg:#322420;
      }
    }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--paper); color:var(--ink); font-family:"IBM Plex Sans", "Noto Sans SC", sans-serif; }
    button { font:inherit; color:inherit; cursor:pointer; }
    .wrap { max-width:40rem; margin:0 auto; padding:0 1rem 4rem; touch-action:pan-y; }
    header { position:sticky; top:0; z-index:5; display:flex; align-items:center; justify-content:space-between; gap:.5rem; padding:.75rem 0; background:color-mix(in srgb, var(--paper) 92%, transparent); backdrop-filter:blur(8px); }
    .brand { margin:0; color:var(--accent); letter-spacing:.14em; font-size:.75rem; text-transform:uppercase; }
    .datebtn, .themes button { height:2rem; border:1px solid var(--line); background:var(--card); border-radius:999px; }
    .datebtn { padding:0 .75rem; font-size:.75rem; }
    .themes { display:flex; padding:.125rem; }
    .themes button { border:0; background:transparent; color:var(--muted); width:2rem; height:2rem; padding:0; }
    .themes button[aria-pressed="true"] { background:var(--ink); color:var(--paper); }
    .hint { color:var(--muted); font-size:.875rem; }
    article { background:var(--card); border:1px solid var(--line); border-radius:1rem; padding:1rem; margin-top:1rem; }
    .kicker { color:var(--accent); letter-spacing:.12em; font-size:.75rem; text-transform:uppercase; }
    h2, .passage, .q, .sense { font-family:"Source Serif 4", "Noto Serif SC", Palatino, serif; }
    h2 { font-size:1.25rem; margin:.25rem 0 0; }
    .passage { font-size:1.125rem; line-height:1.65; }
    .q { font-size:1.125rem; line-height:1.55; }
    .sense { font-size:1.125rem; line-height:1.6; }
    .viewport { overflow:hidden; }
    .track { display:flex; width:200%; transition:transform .3s ease; }
    .pane { width:50%; }
    .w.hit { background:var(--mark); }
    .opt { display:block; width:100%; text-align:left; min-height:2.75rem; margin-top:.5rem; padding:.5rem .75rem; border-radius:.75rem; border:1px solid var(--line); background:var(--paper); font-size:1rem; }
    .opt.good { border-color:var(--ok); background:var(--okbg); color:var(--ok); }
    .opt.bad { border-color:var(--bad); background:var(--badbg); color:var(--bad); }
    .opt.on { border-color:var(--accent); }
    .why { color:var(--ok); font-size:.875rem; }
    .go { width:100%; min-height:2.75rem; margin-top:1rem; border:0; border-radius:.75rem; background:var(--accent); color:var(--paper); }
    .go:disabled { opacity:.4; }
    .gloss { color:var(--accent); font-size:.875rem; }
    .cal { position:absolute; z-index:6; width:16rem; margin-top:.4rem; padding:.75rem; background:var(--card); border:1px solid var(--line); border-radius:1rem; }
    .cal grid, .grid { display:grid; grid-template-columns:repeat(7,1fr); gap:.2rem; text-align:center; }
    .cal button.day { height:2rem; border:0; background:transparent; border-radius:.5rem; font-size:.75rem; position:relative; }
    .cal button.day.sel { background:var(--ink); color:var(--paper); }
    .cal button.day.has { background:color-mix(in srgb, var(--accent) 28%, transparent); }
    .cal button.day.sel.has { background:var(--ink); }
    .row { display:flex; gap:.5rem; }
    .row button, .row label { flex:1; min-height:2.75rem; border:1px solid var(--line); background:var(--card); border-radius:.75rem; display:flex; align-items:center; justify-content:center; }
    .ext { color:var(--accent); }
    .small { color:var(--muted); font-size:.75rem; }
    .toast { position:fixed; bottom:1.5rem; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--paper); border-radius:999px; padding:.4rem 1rem; font-size:.875rem; }
    .sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }
  </style>
</head>
<body>
  <div class="wrap" id="app"></div>
  <script>
    const STORE = "kaoyan-en-board-v3";
    const THEME_KEY = "kaoyan-theme";
    const WASHED = new Set("a an the of to in on for and or as at by from with that this these those it its is are was were be been being have has had do does did not no than then so if when where who which what can will would could should may might their they them he she we you his her our into over after before about there here also just very such most much many out up down your my me him whom whose because while during without within per via onto off each both few more other some any all nor yet still only own same others another every against through above below under again further once why how too don now".split(" "));
    const IRREG = { estimates:"estimate", leaves:"leave", cuts:"cut", suspends:"suspend", flats:"flat", wages:"wage", checks:"check", matters:"matter" };
    let packs = [], senses = {}, freq = { papers: 15, df: {} };
    let state = load();
    let theme = localStorage.getItem(THEME_KEY) || "system";
    let tab = "read";
    let date = "";
    let gloss = "";
    let toast = "";
    let cal = false;
    let cursor = "";
    document.documentElement.dataset.theme = theme;

    function load() {
      try { return JSON.parse(localStorage.getItem(STORE)) || { wrong:{}, pick:{}, submitted:{} }; }
      catch { return { wrong:{}, pick:{}, submitted:{} }; }
    }
    function save() { localStorage.setItem(STORE, JSON.stringify(state)); }
    function todaySH() {
      return new Intl.DateTimeFormat("en-CA", { timeZone:"Asia/Shanghai", year:"numeric", month:"2-digit", day:"2-digit" }).format(new Date());
    }
    function label(iso) { const [,m,d] = iso.split("-"); return Number(m) + "月" + Number(d) + "日"; }
    function stem(w) {
      if (IRREG[w]) return IRREG[w];
      if (w.endsWith("ies") && w.length > 4) return w.slice(0,-3) + "y";
      if (w.endsWith("ing") && w.length > 5) return w.slice(0,-3);
      if (w.endsWith("ed") && w.length > 4) return w.slice(0,-2);
      if (w.endsWith("s") && !w.endsWith("ss") && w.length > 3) return w.slice(0,-1);
      return w;
    }
    function senseOf(w) {
      return senses[w] || senses[stem(w)] || { common: "这条常见义还没写入词库。" };
    }
    function rateLine(w) {
      const key = w.toLowerCase();
      if (WASHED.has(key) || WASHED.has(stem(key))) return null;
      const form = freq.df[key] != null ? key : stem(key);
      const hit = freq.df[form] || 0;
      return freq.papers ? Math.round(hit / freq.papers * 100) : 0;
    }
    function say(t) { toast = t; render(); setTimeout(() => { toast = ""; render(); }, 1200); }
    function toggleWord(word, sentence, title) {
      if (state.wrong[word]) { delete state.wrong[word]; say(word + " 已取消"); }
      else { state.wrong[word] = { word, count:1, sentence, title, last:new Date().toISOString() }; say(word + " 已收入错题本"); }
      save();
    }

    const ICONS = {
      system: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>',
      day: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
      night: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 14.5A8.5 8.5 0 1 1 9.5 3 7 7 0 0 0 21 14.5z"/></svg>'
    };
    function render() {
      const pack = packs.find(p => p.date === date);
      const app = document.getElementById("app");
      app.innerHTML = header() + `<div class="viewport"><div class="track" id="track" style="transform:${tab === "wrong" ? "translateX(-50%)" : "translateX(0)"}"><div class="pane">${readView(pack)}</div><div class="pane">${wrongView()}</div></div></div>` + (toast ? `<div class="toast">${toast}</div>` : "") + (cal ? calendar() : "");
      bind();
    }
    function header() {
      return `<header>
        <button class="datebtn" id="open-cal" type="button">${label(date)}</button>
        <p class="brand">英语二 lite</p>
        <div class="themes" role="group">${["system","day","night"].map(id => {
          const name = {system:"系统", day:"白天", night:"黑夜"}[id];
          return `<button type="button" data-theme="${id}" aria-pressed="${theme===id}" aria-label="${name}">${ICONS[id]}</button>`;
        }).join("")}</div>
      </header>`;
    }
    function readView(pack) {
      if (!pack) return `<p class="hint">${label(date)}还没有文章。</p>`;
      let html = `<p class="hint">左右滑打开错题本。长按单词约半秒标进错题本，再长按取消。提交前不给对错。</p>`;
      pack.passages.forEach((p, index) => {
        const prev = pack.passages[index - 1];
        const locked = index > 0 && !state.submitted[date + ":" + prev.id];
        const done = !!state.submitted[date + ":" + p.id];
        if (locked) {
          html += `<article><p class="kicker">下一篇</p><h2>${p.title}</h2><p class="hint">先交上一篇。做完才能看下一篇。</p></article>`;
          return;
        }
        html += `<article><p class="kicker">${p.minutes} 分钟</p><h2>${esc(p.title)}</h2>`;
        p.paragraphs.forEach(para => { html += `<p class="passage">${words(para, p.title, done)}</p>`; });
        if (done && gloss) html += `<p class="gloss">${esc(gloss)}</p>`;
        const answered = p.quiz.every((_, i) => state.pick[date + ":" + p.id + "-" + i] != null);
        p.quiz.forEach((q, i) => {
          const key = date + ":" + p.id + "-" + i;
          const picked = state.pick[key];
          html += `<p class="q">${i+1}. ${esc(q.q)}</p>`;
          q.options.forEach((op, j) => {
            const cls = ["opt", done && j === q.a ? "good" : "", done && picked === j && j !== q.a ? "bad" : "", !done && picked === j ? "on" : ""].filter(Boolean).join(" ");
            html += `<button class="${cls}" data-pick="${key}" data-j="${j}" ${done ? "disabled" : ""}>${"ABCD"[j]}. ${esc(op)}</button>`;
          });
          if (done) html += `<p class="why">${esc(q.why)}</p>`;
        });
        if (!done) html += `<button class="go" data-submit="${date}:${p.id}" ${answered ? "" : "disabled"}>提交这 ${p.quiz.length} 题</button>`;
        html += `</article>`;
      });
      return html;
    }
    function words(text, title, done) {
      return esc(text).replace(/\b([A-Za-z][A-Za-z'-]+)\b/g, (m) => {
        const w = m.toLowerCase();
        const hit = state.wrong[w] ? " hit" : "";
        return `<span class="w${hit}" data-w="${w}" data-title="${esc(title)}" data-done="${done ? 1 : 0}">${m}</span>`;
      });
    }
    function wrongView() {
      const items = Object.values(state.wrong);
      let html = `<p class="hint">错题本。左右滑回文章。</p><div class="row">
        <button type="button" id="exp">导出</button>
        <label>导入<input id="imp" class="sr" type="file" accept="application/json" /></label>
        <button type="button" id="clr">清空</button></div>`;
      html += card("compose", null, true);
      if (!items.length) html += `<p class="hint">还没有标。滑回文章，长按一个词。只有很难从常见义推出来的意思，才另写一行熟词生义。</p>`;
      items.forEach(item => { html += card(item.word, item, false); });
      return html;
    }
    function card(word, item, example) {
      const s = senseOf(word);
      const pct = rateLine(word);
      return `<article>${example ? `<p class="small">词条示例，不是你的错词</p>` : ""}
        <h2>${esc(word)}</h2>
        <p class="sense">意思 ${esc(s.common)}</p>
        ${s.extended ? `<p class="sense ext">熟词生义 ${esc(s.extended)}</p>` : ""}
        <p class="sense">出现概率 ${pct == null ? "—" : pct + "%"}</p></article>`;
    }
    function calendar() {
      const [y, m] = cursor.split("-").map(Number);
      const pad = (new Date(y, m - 1, 1).getDay() + 6) % 7;
      const n = new Date(y, m, 0).getDate();
      const has = new Set(packs.map(p => p.date));
      const today = todaySH();
      let cells = "";
      for (let i = 0; i < pad; i++) cells += `<span></span>`;
      for (let d = 1; d <= n; d++) {
        const iso = y + "-" + String(m).padStart(2,"0") + "-" + String(d).padStart(2,"0");
        const cls = ["day", iso === date ? "sel" : "", has.has(iso) ? "has" : ""].filter(Boolean).join(" ");
        cells += `<button type="button" class="${cls}" data-day="${iso}" ${iso===today && iso!==date ? `style="color:var(--accent)"` : ""}>${d}</button>`;
      }
      return `<div class="cal" id="calbox"><div class="row">
        <button type="button" id="prev">上月</button><strong>${y}年${m}月</strong><button type="button" id="next">下月</button>
        </div><div class="grid" style="color:var(--muted);font-size:.75rem;margin-top:.5rem">${"一二三四五六日".split("").map(x=>`<span>${x}</span>`).join("")}</div>
        <div class="grid">${cells}</div></div>`;
    }
    function esc(s) {
      return String(s).replace(/&/g, "\u0026amp;").replace(/</g, "\u0026lt;").replace(/>/g, "\u0026gt;").replace(/"/g, "\u0026quot;");
    }

    let hold = null, origin = null, swipe = null;
    function bind() {
      document.querySelectorAll("[data-theme]").forEach(btn => btn.onclick = () => {
        theme = btn.dataset.theme; localStorage.setItem(THEME_KEY, theme);
        document.documentElement.dataset.theme = theme; render();
      });
      const open = document.getElementById("open-cal");
      if (open) open.onclick = () => { cursor = date.slice(0,7); cal = !cal; render(); };
      const prev = document.getElementById("prev");
      const next = document.getElementById("next");
      if (prev) prev.onclick = () => { const [y,m] = cursor.split("-").map(Number); const d = new Date(y, m-2, 1); cursor = d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); render(); };
      if (next) next.onclick = () => { const [y,m] = cursor.split("-").map(Number); const d = new Date(y, m, 1); cursor = d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); render(); };
      document.querySelectorAll("[data-day]").forEach(btn => btn.onclick = () => { date = btn.dataset.day; cal = false; render(); });
      document.querySelectorAll("[data-pick]").forEach(btn => btn.onclick = () => { state.pick[btn.dataset.pick] = Number(btn.dataset.j); save(); render(); });
      document.querySelectorAll("[data-submit]").forEach(btn => btn.onclick = () => { state.submitted[btn.dataset.submit] = new Date().toISOString(); save(); render(); });
      document.querySelectorAll("[data-w]").forEach(el => {
        el.oncontextmenu = e => { e.preventDefault(); toggleWord(el.dataset.w, el.closest("p").textContent.replace(/\s+/g," ").trim(), el.dataset.title); };
        el.onpointerdown = e => { origin = {x:e.clientX,y:e.clientY}; hold = setTimeout(() => { hold = null; toggleWord(el.dataset.w, el.closest("p").textContent.replace(/\s+/g," ").trim(), el.dataset.title); }, 450); };
        el.onpointermove = e => { if (origin && (Math.abs(e.clientX-origin.x)>10 || Math.abs(e.clientY-origin.y)>10) && hold) { clearTimeout(hold); hold = null; } };
        el.onpointerup = () => { if (hold) clearTimeout(hold); hold = null; };
        el.onclick = () => {
          if (el.dataset.done !== "1") return;
          const s = senseOf(el.dataset.w);
          gloss = el.dataset.w + " · " + s.common + (s.extended ? "；熟词生义：" + s.extended : "");
          render();
        };
      });
      const exp = document.getElementById("exp");
      if (exp) exp.onclick = () => { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:"application/json"})); a.download = "wrongbook.json"; a.click(); };
      const imp = document.getElementById("imp");
      if (imp) imp.onchange = () => { const f = imp.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => { try { const p = JSON.parse(r.result); state = { wrong:p.wrong||{}, pick:p.pick||{}, submitted:p.submitted||{} }; save(); say("已导入"); } catch { say("文件不是错题本"); } }; r.readAsText(f); };
      const clr = document.getElementById("clr");
      if (clr) clr.onclick = () => { if (confirm("清空这台设备上的错题和做题记录？")) { state = { wrong:{}, pick:{}, submitted:{} }; save(); render(); } };
    }
    document.getElementById("app").addEventListener("pointerdown", e => {
      if (e.target.closest("button,a,input,label,.cal")) return;
      swipe = { x:e.clientX, y:e.clientY };
    });
    document.getElementById("app").addEventListener("pointerup", e => {
      if (!swipe) return;
      const dx = e.clientX - swipe.x, dy = e.clientY - swipe.y;
      swipe = null;
      if (Math.abs(dx) < 64 || Math.abs(dx) < Math.abs(dy) * 1.4) return;
      tab = tab === "read" ? "wrong" : "read";
      cal = false; gloss = "";
      const track = document.getElementById("track");
      if (track) { track.style.transform = tab === "wrong" ? "translateX(-50%)" : "translateX(0)"; return; }
      render();
    });

    Promise.all([fetch("data/packs.json"), fetch("data/senses.json"), fetch("data/freq.json")].map(p => p.then(r => r.json()))).then(([p,s,f]) => {
      packs = p; senses = s; freq = f; date = packs[packs.length-1].date; cursor = date.slice(0,7); render();
    }).catch(() => { document.getElementById("app").textContent = "词表没有加载出来。"; });
  </script>
</body>
</html>
